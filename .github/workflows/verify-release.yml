name: Verify signed release source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Manifest and Git blob verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run positive and tamper-negative checks
        run: node --test tests/verify-release.test.mjs
      - name: Verify signed manifest and all committed release files
        run: node scripts/verify-release.mjs
      - name: Exercise isolated updater apply, rollback and confirm lifecycle
        run: node --test tests/updater-lifecycle.test.mjs
